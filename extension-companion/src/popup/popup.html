<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexAI Companion</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <img src="../../icons/icon-48.png" alt="NexAI Logo" class="brand-logo">
        <span class="brand-title">NexAI</span>
        <span class="badge">Companion</span>
      </div>
      <div class="header-actions">
        <button id="save-tabs-btn" class="icon-btn" title="Save open tabs to workspace">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        </button>
        <button id="open-app-btn" class="icon-btn" title="Open full NexAI web app">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </button>
      </div>
    </header>

    <!-- Page Context Pill (if active) -->
    <div id="context-pill" class="context-pill" style="display: none;">
      <span class="context-label">Page Context:</span>
      <span id="context-title" class="context-text"></span>
      <button id="clear-context-btn" class="clear-btn">×</button>
    </div>

    <!-- Status Banner -->
    <div id="status-banner" class="status-banner" style="display: none;"></div>

    <!-- Chat Messages View -->
    <div id="messages-container" class="messages-container">
      <div class="message assistant">
        <p>Hello! I am your NexAI companion. Ask me questions, summarize this page, or save your workspace tabs.</p>
      </div>
    </div>

    <!-- Bottom Input Box -->
    <div class="input-container">
      <div class="input-wrap">
        <textarea id="query-input" rows="2" placeholder="Ask AI about this page or topic..."></textarea>
        <button id="send-btn" class="send-btn" title="Send query">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
      <div class="footer-meta">
        <span>Gemini 2.0 Flash • Hotkey: Ctrl+Shift+Y</span>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
